<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaf & Lore — Bookstore</title><link rel="stylesheet" href="style.css"></head><body>
<header class="nav"><div class="container nav-inner"><a class="brand" href="#"><span>Leaf</span> & Lore</a><nav><a href="#books">Books</a><button id="cartBtn" class="btn btn-primary">Cart <b id="cartCount">0</b></button></nav></div></header>
<main><section class="store-hero"><div class="container"><span class="eyebrow">CURATED READING</span><h1>Find your next<br><em>great story.</em></h1><p>Thoughtfully selected books for curious minds.</p><div class="search"><input id="search" placeholder="Search by title or author…"> <select id="category"><option value="all">All categories</option><option>Fiction</option><option>Technology</option><option>Self Help</option></select></div></div></section>
<section id="books" class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">OUR COLLECTION</span><h2>Popular books</h2></div><span id="count" class="muted"></span></div><div id="booksGrid" class="grid"></div></div></section></main>
<div id="drawer" class="drawer"><div class="drawer-head"><h2>Your Cart</h2><button id="close" class="btn btn-light">✕</button></div><div id="cartItems"></div><div class="cart-total"><span>Total</span><strong id="total">₹0</strong></div><button id="checkout" class="btn btn-primary wide">Checkout</button></div><div id="overlay"></div><div id="toast" class="toast"></div>
<footer><div class="container">Leaf & Lore · Read more. Imagine more.</div></footer><script src="script.js"></script></body></html>
